# =============================================================================
# Kwitch — Docker Compose (LiveKit-backed API + static web)
# =============================================================================

services:
  api:
    build: ./server
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:?Set LIVEKIT_URL in .env}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      TOKEN_EXPIRE_SECONDS: ${TOKEN_EXPIRE_SECONDS:-3600}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - '3001'
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_LIVEKIT_URL: ${LIVEKIT_URL:?Set LIVEKIT_URL in .env}
        VITE_TOKEN_SERVER_URL: ''
    environment:
      API_UPSTREAM: http://api:3001
    ports:
      - '8080:8080'
    depends_on:
      - api
    restart: unless-stopped
