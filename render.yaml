# =============================================================================
# Render Blueprint — deploy the whole Kwitch stack in one click.
# https://render.com/docs/blueprint-spec
#
#   1. Push this repo to GitHub and create a new Blueprint on Render.
#   2. Fill in the prompted env vars (SDK_APP_ID, SDK_SECRET_KEY).
#   3. After the first deploy, set VITE_USERSIG_SERVER_URL on the static site
#      to the usersig service URL and CORS_ORIGIN on the usersig service to
#      the static site URL, then redeploy. (Render assigns the URLs on
#      first deploy, so this cross-wiring is a one-time step.)
# =============================================================================

services:
  # --- UserSig API (the secure signing path) --------------------------------
  - type: web
    name: kwitch-usersig
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: SDK_APP_ID
        sync: false # prompted — your TRTC SDKAppID
      - key: SDK_SECRET_KEY
        sync: false # prompted — your TRTC SDKSecretKey (server-only!)
      - key: CORS_ORIGIN
        sync: false # set to your frontend URL, e.g. https://kwitch-web.onrender.com
      - key: USERSIG_EXPIRE_SECONDS
        value: '3600'
      - key: TRUST_PROXY
        value: 'true'
      - key: NODE_ENV
        value: production

  # --- Frontend (static site with SPA rewrite) -------------------------------
  - type: web
    name: kwitch-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SDK_APP_ID
        sync: false # prompted — same SDKAppID as above
      - key: VITE_USERSIG_MODE
        value: server
      - key: VITE_USERSIG_SERVER_URL
        sync: false # set to the kwitch-usersig URL, e.g. https://kwitch-usersig.onrender.com
