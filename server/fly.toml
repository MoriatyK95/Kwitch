# Fly.io config for the Kwitch UserSig server.
#
#   cd server
#   fly launch --copy-config --no-deploy
#   fly secrets set SDK_APP_ID=140xxxxxxx SDK_SECRET_KEY=... CORS_ORIGIN=https://your-frontend.example
#   fly deploy

app = "kwitch-usersig"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  TRUST_PROXY = "true"
  USERSIG_EXPIRE_SECONDS = "3600"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "3s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
