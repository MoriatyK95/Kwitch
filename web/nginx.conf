# nginx config for serving the Kwitch SPA in production.
#  - SPA fallback so /watch/:id deep links survive a refresh
#  - long-lived immutable caching for hashed assets
#  - gzip for text assets
#  - sane security headers (HTTPS/HSTS is expected to terminate upstream at
#    your load balancer or CDN)

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

    # Container/LB health probe.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}';
    }

    # Hashed build assets never change — cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML shell so deploys roll out immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any unknown path is handled by the Vue router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
